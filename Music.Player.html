<!DOCTYPE html>
<html lang="lo">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องเล่นเพลงพร้อมระบบบันทึกเพลง</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Lao', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #0f0f1a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* ----- CD Disc Animation ----- */
        .cd-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 10px auto 20px;
        }

        .cd-disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-radial-gradient(circle,
                    #333 0, #111 2px, #222 4px, #111 5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.2);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotateCD 12s linear infinite;
            animation-play-state: paused;
        }

        .cd-disc::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 40%, rgba(255, 255, 255, 0.15) 100%);
            pointer-events: none;
        }

        .cd-center {
            width: 45px;
            height: 45px;
            background: #1e1e2f;
            border-radius: 50%;
            border: 8px solid #444;
            box-shadow: inset 0 0 5px #000;
        }

        @keyframes rotateCD {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* ----- Track Info ----- */
        .track-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 15px;
        }

        /* ----- Progress Bar ----- */
        .progress-container {
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            appearance: none;
            outline: none;
        }

        .progress-bar::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ff7043;
            cursor: pointer;
            box-shadow: 0 0 8px #ff7043;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #bbb;
            margin-top: 5px;
        }

        /* ----- Controls ----- */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-ctrl:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .btn-play {
            width: 55px;
            height: 55px;
            background: #ff7043;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(255, 112, 67, 0.4);
        }

        .btn-play:hover {
            background: #f4511e;
        }

        /* ----- Action Buttons ----- */
        .action-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-action {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-upload {
            background: #0288d1;
            color: white;
        }

        .btn-upload:hover {
            background: #0277bd;
        }

        .btn-clear-all {
            background: #d32f2f;
            color: white;
        }

        .btn-clear-all:hover {
            background: #c62828;
        }

        /* ----- Playlist ----- */
        .playlist {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            max-height: 180px;
            overflow-y: auto;
            text-align: left;
            padding: 8px;
        }

        .playlist-item {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            margin-bottom: 4px;
            color: #ddd;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-item.active {
            background: rgba(255, 112, 67, 0.25);
            color: #ff7043;
            font-weight: bold;
        }

        .song-info-text {
            flex: 1;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
        }

        .btn-delete-single {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 5px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .btn-delete-single:hover {
            background: rgba(255, 82, 82, 0.2);
        }
    </style>
</head>

<body>

    <div class="player-card">
        <!-- CD Disc -->
        <div class="cd-container">
            <div class="cd-disc" id="cdDisc">
                <div class="cd-center"></div>
            </div>
        </div>

        <!-- Track Information -->
        <div class="track-title" id="trackTitle">ກະລຸນາເລືອກເພງ...</div>
        <div class="track-artist" id="trackArtist">Music Player</div>

        <!-- Progress Slider -->
        <div class="progress-container">
            <input type="range" class="progress-bar" id="progressBar" value="0" min="0" max="100">
            <div class="time-info">
                <span id="currentTime">00:00</span>
                <span id="duration">00:00</span>
            </div>
        </div>

        <!-- Playback Controls -->
        <div class="controls">
            <button class="btn-ctrl" id="prevBtn" title="ເພງກ່ອນໜ້າ">⏮️</button>
            <button class="btn-ctrl btn-play" id="playBtn" title="ຫຼິ້ນ / ພັກ">▶️</button>
            <button class="btn-ctrl" id="nextBtn" title="ເພງຖັດໄປ">⏭️</button>
        </div>

        <!-- Buttons for Action -->
        <div class="action-btns">
            <input type="file" id="fileInput" accept="audio/*" multiple style="display: none;">
            <button class="btn-action btn-upload" onclick="document.getElementById('fileInput').click()">
                📂 ເພີ່ມເພງ
            </button>
            <button class="btn-action btn-clear-all" id="clearAllBtn">
                🗑️ ລຶບເພງທັງໝົດ
            </button>
        </div>

        <!-- Playlist -->
        <div class="playlist" id="playlist">
            <div style="text-align: center; color: #888; font-size: 12px; padding: 10px;">
                ກຳລັງໂຫລດລາຍການເພງ...
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const cdDisc = document.getElementById('cdDisc');
        const trackTitle = document.getElementById('trackTitle');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const fileInput = document.getElementById('fileInput');
        const playlistEl = document.getElementById('playlist');
        const clearAllBtn = document.getElementById('clearAllBtn');

        let playlist = []; // เก็บเพลงทั้งหมด [{ id, name, blob }]
        let currentTrackIndex = -1;
        let isPlaying = false;

        // ----- 1. ตั้งค่า IndexedDB สำหรับเก็บไฟล์เพลงถาวร -----
        let db;
        const request = indexedDB.open("MusicPlayerDB", 1);

        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("songs")) {
                db.createObjectStore("songs", {keyPath: "id", autoIncrement: true});
            }
        };

        request.onsuccess = (e) => {
            db = e.target.result;
            loadSongsFromDB(); // โหลดเพลงจากเครื่องขึ้นมาเมื่อเปิดหน้าเว็บ
        };

        request.onerror = (e) => {
            console.error("IndexedDB Error: ", e);
        };

        // ----- 2. โหลดเพลงจาก IndexedDB -----
        function loadSongsFromDB() {
            const tx = db.transaction("songs", "readonly");
            const store = tx.objectStore("songs");
            const getAllRequest = store.getAll();

            getAllRequest.onsuccess = () => {
                playlist = getAllRequest.result;
                renderPlaylist();
                if (playlist.length > 0 && currentTrackIndex === -1) {
                    loadTrack(0, false); // โหลดเพลงแรกเตรียมไว้ แต่ยังไม่เล่นอัตโนมัติ
                }
            };
        }

        // ----- 3. เพิ่มเพลงใหม่ลง IndexedDB -----
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            const tx = db.transaction("songs", "readwrite");
            const store = tx.objectStore("songs");

            files.forEach(file => {
                const songData = {
                    name: file.name.replace(/\.[^/.]+$/, ""),
                    blob: file
                };
                store.add(songData);
            });

            tx.oncomplete = () => {
                loadSongsFromDB();
            };
        });

        // ----- 4. แสดงผล Playlist และ ปุ่มลบทีละเพลง -----
        function renderPlaylist() {
            playlistEl.innerHTML = '';

            if (playlist.length === 0) {
                playlistEl.innerHTML = `
                    <div style="text-align: center; color: #888; font-size: 12px; padding: 10px;">
                        ຍັງບໍ່ມີເພງໃນລາຍການ
                    </div>`;
                trackTitle.innerText = 'ກະລຸນາເລືອກເພງ...';
                currentTimeEl.innerText = '00:00';
                durationEl.innerText = '00:00';
                progressBar.value = 0;
                pauseSong();
                return;
            }

            playlist.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentTrackIndex ? 'active' : ''}`;

                const titleSpan = document.createElement('span');
                titleSpan.className = 'song-info-text';
                titleSpan.innerText = `${index + 1}. ${song.name}`;
                titleSpan.onclick = () => {
                    loadTrack(index, true);
                };

                const delBtn = document.createElement('button');
                delBtn.className = 'btn-delete-single';
                delBtn.innerHTML = '🗑️';
                delBtn.title = 'ລຶບເພງນີ້';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteSingleSong(song.id, index);
                };

                item.appendChild(titleSpan);
                item.appendChild(delBtn);
                playlistEl.appendChild(item);
            });
        }

        // ----- 5. โหลดและเล่นเพลง -----
        function loadTrack(index, autoPlay = true) {
            if (playlist.length === 0 || index < 0 || index >= playlist.length) return;

            currentTrackIndex = index;
            const song = playlist[currentTrackIndex];

            // สร้าง URL จาก Blob
            const songUrl = URL.createObjectURL(song.blob);
            audioPlayer.src = songUrl;
            trackTitle.innerText = song.name;

            renderPlaylist();

            if (autoPlay) {
                playSong();
            }
        }

        function playSong() {
            if (playlist.length === 0) return;
            isPlaying = true;
            audioPlayer.play();
            playBtn.innerText = '⏸️';
            cdDisc.style.animationPlayState = 'running';
        }

        function pauseSong() {
            isPlaying = false;
            audioPlayer.pause();
            playBtn.innerText = '▶️';
            cdDisc.style.animationPlayState = 'paused';
        }

        playBtn.addEventListener('click', () => {
            if (playlist.length === 0) {
                alert('ກະລຸນາເພີ່ມເພງກ່ອນ!');
                return;
            }
            isPlaying ? pauseSong() : playSong();
        });

        // ----- 6. เปลี่ยนเพลง ถัดไป / ย้อนกลับ -----
        nextBtn.addEventListener('click', nextSong);
        prevBtn.addEventListener('click', prevSong);

        function nextSong() {
            if (playlist.length === 0) return;
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex, true);
        }

        function prevSong() {
            if (playlist.length === 0) return;
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex, true);
        }

        audioPlayer.addEventListener('ended', nextSong);

        // ----- 7. ลบเพลงเดียว -----
        function deleteSingleSong(id, index) {
            if (confirm('ທ່ານຕ້ອງການລຶບເພງນີ້ບໍ?')) {
                const tx = db.transaction("songs", "readwrite");
                const store = tx.objectStore("songs");
                store.delete(id);

                tx.oncomplete = () => {
                    // ถ้าลบเพลงที่กำลังเล่นอยู่
                    if (index === currentTrackIndex) {
                        pauseSong();
                        audioPlayer.src = '';
                        currentTrackIndex = -1;
                    } else if (index < currentTrackIndex) {
                        currentTrackIndex--;
                    }
                    loadSongsFromDB();
                };
            }
        }

        // ----- 8. ลบเพลงทั้งหมด -----
        clearAllBtn.addEventListener('click', () => {
            if (playlist.length === 0) {
                alert('ບໍ່ມີເພງໃຫ້ລຶບ');
                return;
            }

            if (confirm('ທ່ານຕັ້ງໃຈຈະລຶບເພງທັງໝົດໃນລາຍການບໍ?')) {
                const tx = db.transaction("songs", "readwrite");
                const store = tx.objectStore("songs");
                store.clear();

                tx.oncomplete = () => {
                    pauseSong();
                    audioPlayer.src = '';
                    playlist = [];
                    currentTrackIndex = -1;
                    renderPlaylist();
                    alert('ລຶບເພງທັງໝົດຮຽບຮ້ອຍແລ້ວ!');
                };
            }
        });

        // ----- 9. Progress Bar และ เวลาเล่น -----
        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.value = progressPercent;

                currentTimeEl.innerText = formatTime(audioPlayer.currentTime);
                durationEl.innerText = formatTime(audioPlayer.duration);
            }
        });

        progressBar.addEventListener('input', () => {
            if (audioPlayer.duration) {
                const seekTime = (progressBar.value / 100) * audioPlayer.duration;
                audioPlayer.currentTime = seekTime;
            }
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>

</html>
