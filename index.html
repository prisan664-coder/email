<!DOCTYPE html>
<html lang="lo">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບຈັດເກບອີເມວ - ໜ້າທຳອິດ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Lao', sans-serif;
        }

        body {
            background-color: #e65100;
            color: #333;
            padding-bottom: 70px;
        }

        .header {
            background-color: #bf360c;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        /* Image Slider */
        .slider-container {
            position: relative;
            max-width: 100%;
            height: 180px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .slides {
            display: flex;
            width: 500%;
            height: 100%;
            animation: slideAnimation 20s infinite;
        }

        .slide {
            width: 100%;
            height: 100%;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Search Bar Container */
        .search-container {
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 30px;
            padding: 5px 8px 5px 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            max-width: 100%;
            margin: 10px 0 15px 0;
            border: 2px solid #ff7043;
            transition: all 0.3s ease;
        }

        .search-container:focus-within {
            border-color: #bf360c;
            box-shadow: 0 6px 20px rgba(191, 54, 12, 0.3);
            transform: translateY(-1px);
        }

        /* Search Input Field */
        .search-input {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 14px;
            color: #333;
            font-family: 'Noto Sans Lao', sans-serif;
        }

        .search-input::placeholder {
            color: #aaa;
        }

        /* Search Button */
        .search-btn {
            background: linear-gradient(135deg, #ff7043, #d84315);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(216, 67, 21, 0.4);
        }

        .search-btn:hover {
            background: linear-gradient(135deg, #f4511e, #bf360c);
            transform: scale(1.03);
        }

        .search-btn:active {
            transform: scale(0.97);
        }

        @keyframes slideAnimation {
            0% {
                transform: translateX(0%);
            }

            18% {
                transform: translateX(0%);
            }

            20% {
                transform: translateX(-20%);
            }

            38% {
                transform: translateX(-20%);
            }

            40% {
                transform: translateX(-40%);
            }

            58% {
                transform: translateX(-40%);
            }

            60% {
                transform: translateX(-60%);
            }

            78% {
                transform: translateX(-60%);
            }

            80% {
                transform: translateX(-80%);
            }

            98% {
                transform: translateX(-80%);
            }

            100% {
                transform: translateX(0%);
            }
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Form Styling */
        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            margin-bottom: 10px;
            color: #bf360c;
            border-bottom: 2px solid #ffe0b2;
            padding-bottom: 5px;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 3px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-add {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-cancel {
            width: 100%;
            background-color: #757575;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
            display: none;
        }

        /* Email Item Styling */
        .email-item {
            background: #fff8e1;
            border-left: 5px solid #ff9800;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
        }

        .email-item p {
            margin: 3px 0;
            font-size: 14px;
        }

        .status-btns,
        .action-btns {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }

        .btn-status,
        .btn-action {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-new {
            background-color: #0288d1;
        }

        .btn-using {
            background-color: #ed6c02;
        }

        .btn-used {
            background-color: #2e7d32;
        }

        .btn-edit {
            background-color: #f57c00;
        }

        .btn-delete {
            background-color: #d32f2f;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #800000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 2px solid #ffb74d;
        }

        .nav-item {
            color: white;
            text-decoration: none;
            text-align: center;
            font-size: 12px;
            flex: 1;
        }

        .nav-item.active {
            color: #ffeb3b;
            font-weight: bold;
        }

        .nav-icon {
            font-size: 18px;
            display: block;
        }
    </style>
</head>

<body>

    <div class="header">
        ລະບົບຈັດເກບ ແລະ ຈັດການອີເມວ
    </div>

    <!-- Image Slider (5 Images) -->
    <div class="slider-container">
        <div class="slides">
            <div class="slide"><img src="Img/1.jpg" alt="Slide 1"></div>
            <div class="slide"><img src="Img/2.jpg" alt="Slide 2"></div>
            <div class="slide"><img src="Img/3.jpg" alt="Slide 3"></div>
            <div class="slide"><img src="Img/4.jpg" alt="Slide 4"></div>
            <div class="slide"><img src="Img/5.jpg" alt="Slide 5"></div>
        </div>
    </div>

    <!-- Search Box -->
    <div class="search-container">
        <input type="text" class="search-input" id="searchInput" placeholder="ຄົ້ນຫາຊື່, ອີເມວ ຫຼື ເບີໂທ... (ค้นหา...)">
        <button class="search-btn" id="searchBtn">
            🔍 <span>ຄົ້ນຫາ</span>
        </button>
    </div>

    <div class="container">
        <!-- Form Add/Edit -->
        <div class="card">
            <h3 id="formTitle">ເພີ່ມອີເມວໃໝ່ (เพิ่มอีเมลใหม่)</h3>
            <input type="hidden" id="editKey">
            <div class="input-group">
                <label>ຊື່ (ชื่อ):</label>
                <input type="text" id="nameInput" placeholder="ປ້ອນຊື່">
            </div>
            <div class="input-group">
                <label>ເບີໂທ (เบอร์โทร):</label>
                <input type="text" id="phoneInput" placeholder="ປ້ອນເບີໂທ">
            </div>
            <div class="input-group">
                <label>ອີເມວ (อีเมล):</label>
                <input type="email" id="emailInput" placeholder="ປ້ອນອີເມວ">
            </div>
            <div class="input-group">
                <label>ລະຫັດຜ່ານ (รหัสผ่าน):</label>
                <input type="text" id="passwordInput" placeholder="ປ້ອນລະຫັດຜ່ານ">
            </div>
            <button class="btn-add" id="saveBtn">ເພີ່ມຂໍ້ມູນ</button>
            <button class="btn-cancel" id="cancelBtn" onclick="resetForm()">ຍົກເລີກການແກ້ໄຂ</button>
        </div>

        <!-- List Active Emails -->
        <div class="card">
            <h3>ລາຍການອີເມວປັດຈຸບັນ (รายการอีเมลปัจจุบัน)</h3>
            <div id="emailList">
                <p style="text-align:center;">ກຳລັງໂຫລດຂໍ້ມູນ...</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <span class="nav-icon">🏠</span>
            ໜ້າທຳອິດ
        </a>
        <a href="history.html" class="nav-item">
            <span class="nav-icon">📜</span>
            ປະຫວັດອີເມວເກົ່າ
        </a>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {getDatabase, ref, push, set, onValue, update, remove} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBriOzZumxBXSpwL6Kavvyd089UiPzTQfw",
            authDomain: "hukhujai-app.firebaseapp.com",
            databaseURL: "https://hukhujai-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hukhujai-app",
            storageBucket: "hukhujai-app.firebasestorage.app",
            messagingSenderId: "536937955261",
            appId: "1:536937955261:web:4a35c99a854a1e58c89cd4",
            measurementId: "G-EXTZ6V7CBH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Save or Update Data
        document.getElementById('saveBtn').addEventListener('click', () => {
            const editKey = document.getElementById('editKey').value;
            const name = document.getElementById('nameInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if (!name || !email || !password) {
                alert('ກະລຸນາປ້ອນຂໍ້ມູນໃຫ້ຄົບຖ້ວນ');
                return;
            }

            if (editKey) {
                // Update
                const itemRef = ref(db, `emails/${editKey}`);
                update(itemRef, {name, phone, email, password}).then(() => {
                    alert('ບັນທຶກການແກ້ໄຂສຳເລັດ!');
                    resetForm();
                });
            } else {
                // Add new
                const emailListRef = ref(db, 'emails');
                const newEmailRef = push(emailListRef);
                set(newEmailRef, {
                    name, phone, email, password,
                    status: 'ໃຫມ່'
                }).then(() => {
                    alert('ເພີ່ມຂໍ້ມູນສຳເລັດ!');
                    resetForm();
                });
            }
        });

        // Read Active Emails
        const emailListRef = ref(db, 'emails');
        onValue(emailListRef, (snapshot) => {
            const data = snapshot.val();
            const emailListDiv = document.getElementById('emailList');
            emailListDiv.innerHTML = '';

            if (!data) {
                emailListDiv.innerHTML = '<p style="text-align:center; color:#666;">ບໍ່ມີຂໍ້ມູນອີເມວ</p>';
                return;
            }

            let hasItems = false;
            for (let id in data) {
                const item = data[id];
                if (item.status !== 'ຂາຍອອກແລ້ວ') {
                    hasItems = true;
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'email-item';
                    itemDiv.innerHTML = `
                        <p><strong>ຊື່:</strong> ${item.name}</p>
                        <p><strong>ເບີໂທ:</strong> ${item.phone || '-'}</p>
                        <p><strong>ອີເມວ:</strong> ${item.email}</p>
                        <p><strong>ລະຫັດຜ່ານ:</strong> ${item.password}</p>
                        <p><strong>ສະຖານະ:</strong> <span style="color:#bf360c; font-weight:bold;">${item.status}</span></p>
                        <div class="status-btns">
                            <button class="btn-status btn-new" onclick="updateStatus('${id}', 'ໃຫມ່')">ໃຫມ່</button>
                            <button class="btn-status btn-using" onclick="updateStatus('${id}', 'ກຳລັງໃຊ້ງານ')">ກຳລັງໃຊ້ງານ</button>
                            <button class="btn-status btn-used" onclick="updateStatus('${id}', 'ຂາຍອອກແລ້ວ')">ຂາຍອອກແລ້ວ</button>
                        </div>
                        <div class="action-btns">
                            <button class="btn-action btn-edit" onclick="editItem('${id}', '${item.name}', '${item.phone || ''}', '${item.email}', '${item.password}')">✏️ ແກ້ໄຂ</button>
                            <button class="btn-action btn-delete" onclick="deleteItem('${id}')">🗑️ ລຶບ</button>
                        </div>
                    `;
                    emailListDiv.appendChild(itemDiv);
                }
            }

            if (!hasItems) {
                emailListDiv.innerHTML = '<p style="text-align:center; color:#666;">ບໍ່ມີຂໍ້ມູນອີເມວທີ່ກຳລັງໃຊ້ງານ</p>';
            }
        });

        // Update status
        window.updateStatus = function (id, status) {
            const itemRef = ref(db, `emails/${id}`);
            update(itemRef, {status: status});
        };

        // Delete item from Database
        window.deleteItem = function (id) {
            if (confirm('ທ່ານຕ້ອງການລຶບรายการນີ້ແທ້ບໍ?')) {
                const itemRef = ref(db, `emails/${id}`);
                remove(itemRef).then(() => {
                    alert('ລຶບຂໍ້ມູນສຳເລັດ!');
                });
            }
        };

        // Edit item
        window.editItem = function (id, name, phone, email, password) {
            document.getElementById('editKey').value = id;
            document.getElementById('nameInput').value = name;
            document.getElementById('phoneInput').value = phone;
            document.getElementById('emailInput').value = email;
            document.getElementById('passwordInput').value = password;

            document.getElementById('formTitle').innerText = 'ແກ້ໄຂຂໍ້ມູນອີເມວ (แก้ไขข้อมูล)';
            document.getElementById('saveBtn').innerText = 'ບັນທຶກການແກ້ໄຂ';
            document.getElementById('cancelBtn').style.display = 'block';
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        // Reset Form
        window.resetForm = function () {
            document.getElementById('editKey').value = '';
            document.getElementById('nameInput').value = '';
            document.getElementById('phoneInput').value = '';
            document.getElementById('emailInput').value = '';
            document.getElementById('passwordInput').value = '';

            document.getElementById('formTitle').innerText = 'ເພີ່ມອີເມວໃໝ່ (เพิ่มอีเมลใหม่)';
            document.getElementById('saveBtn').innerText = 'ເພີ່ມຂໍ້ມູນ';
            document.getElementById('cancelBtn').style.display = 'none';
        };

        // ฟังก์ชันค้นหา Real-time
        document.getElementById('searchInput').addEventListener('keyup', function () {
            const filterValue = this.value.toLowerCase();
            const items = document.querySelectorAll('.email-item, .history-item'); // ดึงรายการในหน้าเว็บมาตรวจ

            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(filterValue)) {
                    item.style.display = 'block'; // แสดงถ้่าตรงคำค้นหา
                } else {
                    item.style.display = 'none';  // ซ่อนถ้าไม่ตรง
                }
            });
        });

    </script>
</body>

</html>
